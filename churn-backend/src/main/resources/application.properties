spring.application.name=churn-backend
server.port=8080

# Python (FastAPI) model service
ml.service.base-url=http://127.0.0.1:8000
ml.service.connect-timeout-ms=3000
ml.service.read-timeout-ms=10000

# In-memory H2 database (prediction history). Data resets on restart.
spring.datasource.url=jdbc:h2:mem:churndb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
